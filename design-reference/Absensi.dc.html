<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F5F7FA; font-family: 'Plus Jakarta Sans', sans-serif; }
    select { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</helmet>
<div style="display:flex; min-height:100vh; width:100%; background:#F5F7FA;">

  <div style="width:232px; flex-shrink:0; background:#FFFFFF; border-right:1px solid #E4E9F2; display:flex; flex-direction:column; padding:20px 14px;">
    <div style="padding:6px 8px 20px 8px;"><img src="./assets/logistax-logo.png" alt="Logistax" style="height:26px; display:block;"></div>
    <div style="display:flex; flex-direction:column; gap:2px;">
      <a href="./Dashboard.dc.html" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border-left:3px solid transparent; text-decoration:none;" style-hover="background:#F5F7FA;"><div style="width:8px; height:8px; border-radius:2px; background:#98A2B3;"></div><span style="font-size:14px; font-weight:600; color:#475467;">Dashboard</span></a>
      <a href="./Manajemen%20Intern.dc.html" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border-left:3px solid transparent; text-decoration:none;" style-hover="background:#F5F7FA;"><div style="width:8px; height:8px; border-radius:2px; background:#98A2B3;"></div><span style="font-size:14px; font-weight:600; color:#475467;">Manajemen Intern</span></a>
      <a href="#" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; background:#EEF2FB; border-left:3px solid #00A6C0; text-decoration:none;"><div style="width:8px; height:8px; border-radius:2px; background:#003087;"></div><span style="font-size:14px; font-weight:700; color:#003087;">Absensi</span></a>
      <a href="./Penilaian.dc.html" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border-left:3px solid transparent; text-decoration:none;" style-hover="background:#F5F7FA;"><div style="width:8px; height:8px; border-radius:2px; background:#98A2B3;"></div><span style="font-size:14px; font-weight:600; color:#475467;">Penilaian</span></a>
      <a href="./Sertifikat%20dan%20Laporan.dc.html" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; border-left:3px solid transparent; text-decoration:none;" style-hover="background:#F5F7FA;"><div style="width:8px; height:8px; border-radius:2px; background:#98A2B3;"></div><span style="font-size:14px; font-weight:600; color:#475467;">Sertifikat &amp; Laporan</span></a>
    </div>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #E4E9F2;">
      <a href="#" style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; text-decoration:none;" style-hover="background:#F5F7FA;"><div style="width:8px; height:8px; border-radius:2px; background:#98A2B3;"></div><span style="font-size:14px; font-weight:600; color:#475467;">Logout</span></a>
    </div>
  </div>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column;">
    <div style="height:64px; flex-shrink:0; background:#FFFFFF; border-bottom:1px solid #E4E9F2; display:flex; align-items:center; justify-content:space-between; padding:0 28px;">
      <div style="font-size:18px; font-weight:800; color:#16213D;">Absensi</div>
      <div style="display:flex; align-items:center; gap:16px;">
        <div style="position:relative; cursor:pointer;"><div style="width:36px; height:36px; border-radius:50%; background:#F5F7FA; display:flex; align-items:center; justify-content:center;"><div style="width:16px; height:16px; border:1.5px solid #475467; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;"></div></div></div>
        <div style="display:flex; align-items:center; gap:10px; border-left:1px solid #E4E9F2; padding-left:16px;"><div style="width:36px; height:36px; border-radius:50%; background:#003087; color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;">DA</div><div><div style="font-size:13.5px; font-weight:700; color:#16213D; line-height:1.2;">Dewi Anggraini</div><div style="font-size:11px; font-weight:700; color:#003087; background:#EEF2FB; padding:1px 8px; border-radius:6px; display:inline-block; margin-top:2px;">Admin Magang</div></div></div>
      </div>
    </div>

    <div style="flex:1; padding:28px; overflow:auto;">

      <div style="display:flex; gap:6px; margin-bottom:20px;">
        <button onClick="{{ goRekap }}" style="padding:10px 18px; border-radius:8px 8px 0 0; border:none; border-bottom:2.5px solid {{ rekapBorder }}; background:none; font-size:14px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; color:{{ rekapColor }}; cursor:pointer;">Rekap Kehadiran</button>
        <button onClick="{{ goApproval }}" style="padding:10px 18px; border-radius:8px 8px 0 0; border:none; border-bottom:2.5px solid {{ approvalBorder }}; background:none; font-size:14px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; color:{{ approvalColor }}; cursor:pointer; display:flex; align-items:center; gap:8px;">
          Perlu Approval
          <span style="background:#FEE2E2; color:#B91C1C; font-size:11px; font-weight:800; padding:1px 8px; border-radius:100px;">{{ approvalCount }}</span>
        </button>
      </div>

      <sc-if value="{{ isRekap }}">
        <div style="background:#FFFFFF; border:1px solid #E4E9F2; border-radius:12px; padding:16px 20px; margin-bottom:18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
          <select style="padding:10px 12px; border:1px solid #E4E9F2; border-radius:8px; font-size:13.5px; color:#475467; outline:none;"><option>September 2026</option><option>Agustus 2026</option><option>Oktober 2026</option></select>
          <select style="padding:10px 12px; border:1px solid #E4E9F2; border-radius:8px; font-size:13.5px; color:#475467; outline:none;"><option>Semua Divisi</option><option>Pajak Korporat</option><option>Audit Internal</option><option>Konsultasi Pajak</option></select>
          <select style="padding:10px 12px; border:1px solid #E4E9F2; border-radius:8px; font-size:13.5px; color:#475467; outline:none;"><option>Semua Intern</option><option>Bagas Kurniawan</option><option>Salsabila Ramadhani</option></select>
          <div style="margin-left:auto; display:flex; align-items:center; gap:16px;">
            <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#667085;"><div style="width:10px; height:10px; border-radius:3px; background:#DCFCE7; border:1px solid #86EFAC;"></div>Hadir</div>
            <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#667085;"><div style="width:10px; height:10px; border-radius:3px; background:#DBEAFE; border:1px solid #93C5FD;"></div>Izin</div>
            <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#667085;"><div style="width:10px; height:10px; border-radius:3px; background:#FEF3C7; border:1px solid #FCD34D;"></div>Sakit</div>
            <div style="display:flex; align-items:center; gap:6px; font-size:12px; color:#667085;"><div style="width:10px; height:10px; border-radius:3px; background:#FEE2E2; border:1px solid #FCA5A5;"></div>Absen</div>
            <button style="padding:9px 16px; background:#003087; color:#FFFFFF; border:none; border-radius:8px; font-size:13px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; cursor:pointer; white-space:nowrap;" style-hover="background:#001F5C;">Export Excel / PDF</button>
          </div>
        </div>

        <div style="background:#FFFFFF; border:1px solid #E4E9F2; border-radius:12px; padding:20px; overflow-x:auto;">
          <div style="display:flex; min-width:960px;">
            <div style="width:170px; flex-shrink:0;">
              <div style="height:26px;"></div>
              <sc-for list="{{ rekapRows }}" as="row" hint-placeholder-count="6">
                <div style="height:30px; display:flex; align-items:center; font-size:13px; font-weight:700; color:#16213D;">{{ row.name }}</div>
              </sc-for>
            </div>
            <div style="flex:1; overflow-x:auto;">
              <div style="display:flex; gap:2px; height:26px;">
                <sc-for list="{{ dayLabels }}" as="d" hint-placeholder-count="30">
                  <div style="width:22px; flex-shrink:0; font-size:9.5px; color:#98A2B3; text-align:center;">{{ d }}</div>
                </sc-for>
              </div>
              <sc-for list="{{ rekapRows }}" as="row" hint-placeholder-count="6">
                <div style="display:flex; gap:2px; height:30px; align-items:center;">
                  <sc-for list="{{ row.days }}" as="c" hint-placeholder-count="30">
                    <div style="width:22px; height:22px; flex-shrink:0; border-radius:5px; background:{{ c.bg }};"></div>
                  </sc-for>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isApproval }}">
        <div style="display:flex; flex-direction:column; gap:14px;">
          <sc-for list="{{ approvals }}" as="a" hint-placeholder-count="3">
            <div style="background:#FFFFFF; border:1px solid #E4E9F2; border-radius:12px; padding:18px 20px; display:flex; align-items:center; gap:18px;">
              <div style="width:60px; height:60px; border-radius:8px; background:repeating-linear-gradient(45deg,#F0F2F6,#F0F2F6 6px,#E4E9F2 6px,#E4E9F2 12px); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#98A2B3; text-align:center;">BUKTI</div>
              <div style="flex:1;">
                <div style="font-size:14px; font-weight:700; color:#16213D;">{{ a.name }} <span style="font-weight:600; color:#667085; font-size:12.5px;">· {{ a.division }}</span></div>
                <div style="font-size:12.5px; color:#667085; margin-top:3px;">Pengajuan <span style="font-weight:700; color:{{ a.typeColor }};">{{ a.type }}</span> — {{ a.date }}</div>
                <div style="font-size:12.5px; color:#98A2B3; margin-top:3px;">"{{ a.note }}"</div>
              </div>
              <div style="display:flex; gap:8px; flex-shrink:0;">
                <button style="border:none; background:#DCFCE7; color:#15803D; border-radius:6px; padding:8px 16px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;">Approve</button>
                <button style="border:none; background:#FEE2E2; color:#B91C1C; border-radius:6px; padding:8px 16px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;">Reject</button>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { tab: 'rekap' };
  names = ['Bagas Kurniawan', 'Salsabila Ramadhani', 'Aulia Rahmawati', 'Rizky Firmansyah', 'Fikri Alamsyah', 'Dimas Wijaya Putra'];
  statusColors = { hadir: '#DCFCE7', izin: '#DBEAFE', sakit: '#FEF3C7', absen: '#FEE2E2', weekend: '#F5F7FA' };

  seedStatus(rowIdx, day) {
    const dow = ((day - 1) % 7);
    if (dow === 5 || dow === 6) return 'weekend';
    const v = (rowIdx * 7 + day) % 11;
    if (v === 0) return 'sakit';
    if (v === 1 || v === 2) return 'izin';
    if (v === 9) return 'absen';
    return 'hadir';
  }

  approvalList = [
    { name: 'Salsabila Ramadhani', division: 'Konsultasi Pajak', type: 'Sakit', typeColor: '#B45309', date: '16 Sep 2026', note: 'Demam tinggi, ada surat dokter terlampir.' },
    { name: 'Fikri Alamsyah', division: 'Legal & Compliance', type: 'Izin', typeColor: '#1D4ED8', date: '17 Sep 2026', note: 'Mengurus keperluan kampus.' },
    { name: 'Dimas Wijaya Putra', division: 'Legal & Compliance', type: 'Izin', typeColor: '#1D4ED8', date: '17 Sep 2026', note: 'Sidang skripsi.' }
  ];

  renderVals() {
    const s = this.state;
    const rekapRows = this.names.map((name, i) => ({
      name,
      days: Array.from({ length: 30 }, (_, d) => ({ bg: this.statusColors[this.seedStatus(i, d + 1)] }))
    }));
    return {
      isRekap: s.tab === 'rekap', isApproval: s.tab === 'approval',
      goRekap: () => this.setState({ tab: 'rekap' }), goApproval: () => this.setState({ tab: 'approval' }),
      rekapColor: s.tab === 'rekap' ? '#003087' : '#98A2B3', rekapBorder: s.tab === 'rekap' ? '#00A6C0' : 'transparent',
      approvalColor: s.tab === 'approval' ? '#003087' : '#98A2B3', approvalBorder: s.tab === 'approval' ? '#00A6C0' : 'transparent',
      approvalCount: this.approvalList.length,
      dayLabels: Array.from({ length: 30 }, (_, d) => d + 1),
      rekapRows,
      approvals: this.approvalList
    };
  }
}

</script>
</body>
</html>
