<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F5F7FA; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</helmet>
<div style="display:flex; min-height:100vh; width:100%; background:#F5F7FA;">
  <div style="flex:1 1 46%; min-width:320px; background:linear-gradient(150deg,#001F5C 0%,#003087 55%,#00577A 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:64px 40px; position:relative; overflow:hidden;">
    <div style="position:absolute; top:-60px; right:-60px; width:220px; height:220px; background:rgba(0,166,192,0.18); border-radius:50%;"></div>
    <div style="position:absolute; bottom:-80px; left:-40px; width:260px; height:260px; background:rgba(255,255,255,0.06); border-radius:50%;"></div>
    <div style="background:#FFFFFF; border-radius:16px; padding:24px 32px; box-shadow:0 20px 40px rgba(0,15,50,0.25); z-index:1;">
      <img src="./assets/logistax-logo.png" alt="Logistax" style="height:44px; display:block;">
    </div>
    <div style="margin-top:32px; text-align:center; z-index:1;">
      <div style="color:#FFFFFF; font-size:28px; font-weight:700; letter-spacing:0.2px;">Sistem Manajemen Magang</div>
      <div style="color:rgba(255,255,255,0.7); font-size:15px; font-weight:400; margin-top:10px; max-width:380px;">Kelola pendaftaran, absensi, penilaian, dan sertifikat intern dalam satu platform.</div>
    </div>
  </div>
  <div style="flex:1 1 54%; min-width:320px; display:flex; align-items:center; justify-content:center; padding:40px;">
    <div style="width:100%; max-width:380px;">
      <div style="font-size:24px; font-weight:800; color:#16213D;">Masuk ke akun Anda</div>
      <div style="font-size:14px; color:#667085; margin-top:6px;">Gunakan kredensial admin atau supervisor mentor Anda.</div>

      <div style="margin-top:32px; display:flex; flex-direction:column; gap:18px;">
        <div>
          <label style="display:block; font-size:13px; font-weight:600; color:#16213D; margin-bottom:6px;">Email</label>
          <input type="email" placeholder="nama@logistax.id" value="{{ email }}" onChange="{{ onEmailChange }}" style="width:100%; box-sizing:border-box; padding:12px 14px; border:1px solid #E4E9F2; border-radius:8px; font-size:14px; font-family:'Plus Jakarta Sans',sans-serif; color:#16213D; outline:none;" style-focus="border-color:#00A6C0;">
        </div>
        <div>
          <label style="display:block; font-size:13px; font-weight:600; color:#16213D; margin-bottom:6px;">Password</label>
          <div style="position:relative;">
            <input type="{{ passwordFieldType }}" placeholder="••••••••" value="{{ password }}" onChange="{{ onPasswordChange }}" style="width:100%; box-sizing:border-box; padding:12px 44px 12px 14px; border:1px solid #E4E9F2; border-radius:8px; font-size:14px; font-family:'Plus Jakarta Sans',sans-serif; color:#16213D; outline:none;" style-focus="border-color:#00A6C0;">
            <button onClick="{{ toggleShowPassword }}" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center;">
              <div style="width:20px; height:20px; border-radius:50%; border:1.5px solid #98A2B3; position:relative;">
                <div style="width:8px; height:8px; border-radius:50%; background:{{ eyeDotColor }}; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);"></div>
              </div>
            </button>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end;">
          <a href="#" style="font-size:13px; color:#00A6C0; font-weight:600; text-decoration:none;" style-hover="text-decoration:underline;">Lupa password?</a>
        </div>
        <button onClick="{{ onLogin }}" style="width:100%; padding:13px; background:#003087; color:#FFFFFF; border:none; border-radius:8px; font-size:15px; font-weight:700; font-family:'Plus Jakarta Sans',sans-serif; cursor:pointer; margin-top:8px;" style-hover="background:#001F5C;">Login</button>
      </div>

      <div style="margin-top:28px; padding:14px 16px; background:#F5F7FA; border-radius:10px; font-size:12.5px; color:#667085; line-height:1.6;">
        Pendaftaran intern baru dilakukan melalui aplikasi mobile, bukan dashboard ini.
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { email: '', password: '', showPassword: false };
  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      passwordFieldType: this.state.showPassword ? 'text' : 'password',
      eyeDotColor: this.state.showPassword ? '#00A6C0' : '#98A2B3',
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      onPasswordChange: (e) => this.setState({ password: e.target.value }),
      toggleShowPassword: () => this.setState(s => ({ showPassword: !s.showPassword })),
      onLogin: () => {}
    };
  }
}

</script>
</body>
</html>
